<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmarks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            -webkit-app-region: drag;
            user-select: none;
            overflow: hidden;
        }
        .drag-region { -webkit-app-region: drag; }
        .no-drag-region { -webkit-app-region: no-drag; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 p-4 rounded-lg shadow-lg">
    <div class="flex justify-between items-center mb-4 drag-region">
        <h2 class="text-lg font-bold">Bookmarks</h2>
        <button id="close-bookmarks-btn" class="no-drag-region text-gray-500 hover:text-gray-700 transition-all">
            <i class="fa-solid fa-xmark text-xl"></i>
        </button>
    </div>
    
    <div id="bookmark-list" class="flex flex-col gap-2 overflow-y-auto no-scrollbar" style="max-height: calc(100vh - 150px);">
        </div>
    
    <button id="add-bookmark-btn" class="no-drag-region mt-4 w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition-colors">
        Add Current Page
    </button>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const addBookmarkBtn = document.getElementById('add-bookmark-btn');
            const bookmarkList = document.getElementById('bookmark-list');
            const closeBookmarksBtn = document.getElementById('close-bookmarks-btn');

            addBookmarkBtn.addEventListener('click', () => {
                window.electronAPI.addBookmark();
            });

            closeBookmarksBtn.addEventListener('click', () => {
                window.electronAPI.closeBookmarksWindow();
            });

            window.electronAPI.onUpdateBookmarks((event, bookmarks) => {
                bookmarkList.innerHTML = '';
                bookmarks.forEach(bookmark => {
                    const bookmarkItem = document.createElement('div');
                    bookmarkItem.className = 'flex items-center justify-between p-2 bg-gray-200 rounded-md hover:bg-gray-300 transition-colors cursor-pointer';
                    bookmarkItem.innerHTML = `
                        <span class="text-sm truncate pr-2">${bookmark.title}</span>
                        <div class="flex-shrink-0 flex items-center gap-2 no-drag-region">
                            <button class="remove-bookmark-btn text-gray-500 hover:text-red-500 transition-colors text-xs">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    `;
                    bookmarkItem.addEventListener('click', (e) => {
                        if (e.target.closest('.remove-bookmark-btn')) {
                            const url = bookmark.url;
                            window.electronAPI.removeBookmark(url);
                        } else {
                            window.electronAPI.loadBookmarkInMain(bookmark.url);
                        }
                    });
                    bookmarkList.appendChild(bookmarkItem);
                });
            });

            // Request bookmarks from the main process on load
            window.electronAPI.requestBookmarks();
        });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
</body>
</html>
