<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            -webkit-app-region: drag;
            user-select: none;
            overflow: hidden;
        }
        .drag-region { -webkit-app-region: drag; }
        .no-drag-region { -webkit-app-region: no-drag; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 p-4 rounded-lg shadow-lg">
    <div class="flex justify-between items-center mb-4 drag-region">
        <h2 class="text-lg font-bold">History</h2>
        <button id="close-history-btn" class="no-drag-region text-gray-500 hover:text-gray-700 transition-all">
            <i class="fa-solid fa-xmark text-xl"></i>
        </button>
    </div>
    
    <div id="history-list" class="flex flex-col gap-2 overflow-y-auto no-scrollbar" style="max-height: calc(100vh - 150px);">
        </div>
    
    <button id="clear-all-history-btn" class="no-drag-region mt-4 w-full bg-red-500 text-white py-2 rounded-lg hover:bg-red-600 transition-colors">
        Clear All
    </button>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const clearAllBtn = document.getElementById('clear-all-history-btn');
            const historyList = document.getElementById('history-list');
            const closeHistoryBtn = document.getElementById('close-history-btn');

            clearAllBtn.addEventListener('click', () => {
                window.electronAPI.clearAllHistory();
            });

            closeHistoryBtn.addEventListener('click', () => {
                window.electronAPI.closeHistoryWindow();
            });

            window.electronAPI.onUpdateHistory((event, history) => {
                historyList.innerHTML = '';
                history.reverse().forEach(item => {
                    const historyItem = document.createElement('div');
                    historyItem.className = 'flex items-center justify-between p-2 bg-gray-200 rounded-md hover:bg-gray-300 transition-colors cursor-pointer';
                    historyItem.innerHTML = `
                        <span class="text-sm truncate pr-2">${item.title}</span>
                        <div class="flex-shrink-0 flex items-center gap-2 no-drag-region">
                            <button class="remove-history-item-btn text-gray-500 hover:text-red-500 transition-colors text-xs">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    `;
                    historyItem.addEventListener('click', (e) => {
                        // Check if the click was on the trash icon or elsewhere
                        if (e.target.closest('.remove-history-item-btn')) {
                            // If trash icon was clicked, remove the item
                            window.electronAPI.removeHistoryItem(item.url);
                        } else {
                            // Otherwise, load the URL
                            window.electronAPI.loadHistoryInMain(item.url);
                        }
                    });
                    historyList.appendChild(historyItem);
                });
            });

            window.electronAPI.requestHistory();
        });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
</body>
</html>
