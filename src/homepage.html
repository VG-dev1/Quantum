<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Browser Homepage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        .homepage-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f3f4f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="homepage-container">
        <div class="homepage-content flex flex-col items-center justify-center bg-white rounded-lg shadow-md p-6">
            <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold text-gray-700 mb-8">Quantum Browser</h1>
            <div class="relative w-full max-w-lg mb-8">
                <input type="text" id="homepage-search" placeholder="Search with Google" class="w-full p-4 pl-12 text-lg rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
            </div>
            <h2 class="text-xl sm:text-2xl font-semibold text-gray-600 mb-4">Shortcuts</h2>
            <div id="shortcuts-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                <div id="add-shortcut-btn" class="shortcut-item flex flex-col items-center justify-center w-24 h-24 p-2 cursor-pointer bg-gray-200 rounded-lg hover:bg-gray-300 transition-all">
                    <div class="shortcut-icon flex items-center justify-center w-12 h-12 bg-gray-300 text-gray-600 rounded-full text-2xl font-bold">
                        <i class="fa-solid fa-plus"></i>
                    </div>
                    <span class="mt-2 text-sm text-gray-700 truncate w-full text-center">Add</span>
                </div>
            </div>
        </div>
    </div>
    
    <div id="shortcut-dialog" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden no-drag-region">
        <div class="bg-white p-6 rounded-lg shadow-xl w-11/12 md:w-1/3 no-drag-region">
            <h3 class="text-xl font-semibold mb-4 text-center">Add a New Shortcut</h3>
            <div class="flex flex-col gap-4">
                <input type="text" id="shortcut-name-input" placeholder="Name" class="p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="text" id="shortcut-url-input" placeholder="URL (e.g. https://www.google.com)" class="p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="flex justify-end gap-2 mt-4">
                <button id="add-shortcut-cancel" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition-all">Cancel</button>
                <button id="add-shortcut-confirm" class="px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 transition-all">Add</button>
            </div>
        </div>
    </div>

    <div id="delete-shortcut-dialog" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden no-drag-region">
        <div class="bg-white p-6 rounded-lg shadow-xl w-11/12 md:w-1/4 text-center no-drag-region">
            <h3 class="text-xl font-semibold mb-4">Are you sure you want to delete this shortcut?</h3>
            <div class="flex justify-center gap-4 mt-4">
                <button id="delete-shortcut-confirm-btn" class="px-6 py-2 bg-red-500 text-white rounded-md hover:bg-red-600 transition-all">Yes, delete it</button>
                <button id="delete-shortcut-cancel-btn" class="px-6 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition-all">Cancel</button>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
    <script src="./js/homepage.js"></script>
</body>
</html>
